# Quelle für die Metadaten im Contao Manager (contao/package-metadata).
# Änderungen hier werden von Claude in den Fork übertragen.

de:
    title: Schachaufgaben
    description: >
        Training mit Aufgaben aus echten Partien wie bei Lichess. Mitglieder und Gäste lösen die
        Aufgaben auf einem Brett im Browser. Eine eigene Wertung passt die Schwierigkeit laufend an,
        und keine Aufgabe wird nach dem ersten Zug ein zweites Mal gestellt. Jede Aufgabe lässt sich
        nach dem Lösen bewerten.

        Dazu eine Rangliste der Mitglieder, eine Liste der höchsten je erreichten Wertungen und eine
        Rangliste, die jeden Monat gespeichert wird. Die freie Sammlung von Lichess lässt sich im
        Backend oder auf der Konsole importieren.
    keywords:
        - Schach
        - Schachaufgaben
        - Taktik
        - Training
        - Lichess
        - Rangliste
        - Bestenliste
        - Glicko

en:
    title: Chess puzzles
    description: >
        Chess puzzle training like on Lichess. Members and guests solve puzzles taken from real
        games on a board in the browser. A personal rating keeps adjusting the difficulty, and no
        puzzle is shown again once it has been started. Every puzzle can be rated after solving it.

        Includes a ranking of members, a list of the highest ratings ever reached and a ranking
        saved every month. The free Lichess puzzle collection can be imported in the back end or on
        the command line.
    keywords:
        - chess
        - puzzles
        - tactics
        - training
        - Lichess
        - ranking
        - leaderboard
        - Glicko
