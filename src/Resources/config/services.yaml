# Alle Klassen unter src/ werden automatisch als Dienste registriert, damit
# künftige Konsolenbefehle (Aufgaben-Import), Hooks, DCA-Callbacks und
# Controller ohne weitere Einträge greifen. Ausgenommen sind die Klassen,
# die Symfony bzw. der Contao Manager selbst laden, die Contao-Models und die
# klassischen Frontend-Module (beide erzeugt Contao selbst) sowie die Ressourcen.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Schachbulle\ContaoSchachaufgabenBundle\:
        resource: '../../'
        exclude:
            - '../../ContaoSchachaufgabenBundle.php'
            - '../../ContaoManager/'
            - '../../DependencyInjection/'
            - '../../Model/'
            - '../../Module/'
            - '../../Resources/'

    # Controller müssen öffentlich sein, damit der Router sie abrufen kann
    Schachbulle\ContaoSchachaufgabenBundle\Controller\TrainingController:
        public: true
        tags: ['controller.service_arguments']

    # Öffentlich, weil Contao den key-Callback aus $GLOBALS['BE_MOD'] über
    # System::importStatic() aus dem Container holt
    Schachbulle\ContaoSchachaufgabenBundle\Backend\ImportSeite:
        public: true
        arguments:
            $tokenManager: '@contao.csrf.token_manager'
            $tokenName: '%contao.csrf_token_name%'
            $projektVerzeichnis: '%kernel.project_dir%'
            $uploadPfad: '%contao.upload_path%'

    # Ebenso öffentlich (key-Callback), für die Statistik
    Schachbulle\ContaoSchachaufgabenBundle\Backend\StatistikSeite:
        public: true

    # Ebenso öffentlich (key-Callback), für den PGN-Import
    Schachbulle\ContaoSchachaufgabenBundle\Backend\PgnImportSeite:
        public: true
        arguments:
            $tokenManager: '@contao.csrf.token_manager'
            $tokenName: '%contao.csrf_token_name%'
